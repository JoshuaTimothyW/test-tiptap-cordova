name: Mobile build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [dist/index.html]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 1.2.0). Bundled into bundle-<version>.zip.'
        required: false
        default: ''
      build_apk:
        description: 'Build signed release APK?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version and flags
        id: version
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ -n "$VERSION_INPUT" ]; then
            echo "version=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # manual tanpa version / push index.html: versi unik per run,
            # biar bootstrap.js (compare remote.version != localVersion) selalu deteksi update.
            echo "version=dev-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi
          # APK dibuild hanya: manual dgn flag build_apk=true, atau tag v*.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "need_apk=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_apk }}" = "true" ]; then
            echo "need_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_apk=false" >> "$GITHUB_OUTPUT"
          fi

      # No editor source in this repo: dist/index.html is COMMITTED here.
      # This workflow only packages + builds the APK from it.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        if: steps.version.outputs.need_apk == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        if: steps.version.outputs.need_apk == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.ref }}

      - name: Stage bundle into mobile scaffold
        run: node scripts/stage-mobile.mjs

      - name: Pre-flight verify
        run: node mobile/verify-mobile.mjs

      # No setup-android action: it runs `sdkmanager tools`, which cmdline-tools
      # 16 removed — hard failure. The runner image ships the full Android SDK
      # (ANDROID_HOME=/usr/local/lib/android/sdk) with licenses pre-accepted.
      # Self-heal scaffold plugin specs. The scaffold shipped webintent@^3.0.0
      # (never existed on npm) and local-notification@^0.9.0-beta.3 (pre-AndroidX
      # beta). Both break `cordova platform add`. Also, cordova does NOT
      # understand the npm tag "latest" — spec must be a real version. Force the
      # known-good versions so a stale config.xml can't fail the build again.
      - name: Pin known-good plugin specs in config.xml
        if: steps.version.outputs.need_apk == 'true'
        run: |
          sed -i 's|cordova-plugin-webintent" spec="[^"]*"|cordova-plugin-webintent" spec="0.0.2"|' mobile/config.xml
          sed -i 's|cordova-plugin-file-transfer" spec="[^"]*"|cordova-plugin-file-transfer" spec="2.0.1"|' mobile/config.xml
          sed -i 's|cordova-plugin-local-notification" spec="[^"]*"|cordova-plugin-local-notification" spec="1.2.3"|' mobile/config.xml
          # edit-config pakai atribut android:, wajib xmlns:android di <widget>,
          # kalau tidak mergeDebugResources lempar AttributePrefixUnbound.
          if ! grep -q 'xmlns:android=' mobile/config.xml; then
            sed -i 's|xmlns:cdv="http://cordova.apache.org/ns/1.0"|xmlns:cdv="http://cordova.apache.org/ns/1.0" xmlns:android="http://schemas.android.com/apk/res/android"|' mobile/config.xml
          fi
          grep -n 'plugin name="cordova-plugin-\|xmlns:android=' mobile/config.xml

      - name: Install Cordova CLI
        if: steps.version.outputs.need_apk == 'true'
        run: npm install -g cordova@12

      - name: Add Android platform
        if: steps.version.outputs.need_apk == 'true'
        run: cordova platform add android
        working-directory: mobile

      - name: Decode keystore + write build.json
        if: steps.version.outputs.need_apk == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > mobile/release-key.jks
          cat > mobile/build.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "./release-key.jks",
                "storePassword": "$KEYSTORE_PASSWORD",
                "alias": "$KEYSTORE_ALIAS",
                "password": "$ALIAS_PASSWORD",
                "keystoreType": ""
              }
            }
          }
          EOF
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}

      - name: Build signed release APK
        if: steps.version.outputs.need_apk == 'true'
        run: cordova build android --release --buildConfig build.json
        working-directory: mobile

      - name: Build update bundle
        run: |
          npm install archiver@7
          node build-bundle.js "${{ steps.version.outputs.version }}"
        working-directory: mobile/server-bundle-builder

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: warn
          path: |
            mobile/platforms/android/app/build/outputs/apk/release/app-release.apk
            mobile/server-bundle-builder/dist/*.zip
            mobile/server-bundle-builder/dist/version.json
            mobile/server-bundle-builder/dist/config.json

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_NAME="${GITHUB_REF_NAME}"
          else
            RELEASE_NAME="mobile-build"
            # re-usable tag for manual dispatch / auto-bundle builds
            if gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_NAME" --silent 2>/dev/null; then
              gh release delete "$RELEASE_NAME" --repo "${{ github.repository }}" --yes --cleanup-tag
            fi
          fi
          APK_ARG=""
          if [ -f mobile/platforms/android/app/build/outputs/apk/release/app-release.apk ]; then
            APK_ARG="mobile/platforms/android/app/build/outputs/apk/release/app-release.apk"
          fi
          gh release create "$RELEASE_NAME" $APK_ARG \
            "mobile/server-bundle-builder/dist"/*.zip \
            "mobile/server-bundle-builder/dist/version.json" \
            "mobile/server-bundle-builder/dist/config.json" \
            --title "$RELEASE_NAME" --notes "Build ${{ steps.version.outputs.version }}"